<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog · Vidhi Vazirani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #13161e; --border: #1e2330; --border2: #2a3048;
      --accent: #6ee7b7; --accent2: #38bdf8; --text: #e2e8f0; --muted: #64748b;
      --serif: 'DM Serif Display', Georgia, serif;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.7; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(1.5rem, 5vw, 4rem); height: 60px;
      background: rgba(13,15,20,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    main {
      position: relative; z-index: 1;
      max-width: 760px; margin: 0 auto;
      padding: 8rem clamp(1.5rem, 5vw, 3rem) 6rem;
    }

    .page-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; }
    .page-title { font-family: var(--serif); font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 400; color: var(--text); margin-bottom: 0.8rem; }
    .page-sub { font-size: 0.95rem; color: var(--muted); margin-bottom: 3rem; }
    .divider { width: 40px; height: 1px; background: var(--accent); margin-bottom: 3rem; }

    /* filter bar */
    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
    .filter-btn {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
      color: var(--muted); background: transparent;
      border: 1px solid var(--border2); padding: 0.25rem 0.75rem; border-radius: 3px;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(110,231,183,0.06); }

    /* blog cards */
    #blog-list { display: flex; flex-direction: column; }

    .blog-card {
      display: block; padding: 2rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none; transition: all 0.15s;
    }
    .blog-card:last-child { border-bottom: none; }
    .blog-card:hover .blog-title { color: var(--accent2); }

    .blog-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 0.5rem; }
    .blog-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 400; color: var(--text); margin-bottom: 0.65rem; transition: color 0.2s; line-height: 1.25; }
    .blog-excerpt { font-size: 0.9rem; color: var(--muted); line-height: 1.75; max-width: 600px; }
    .blog-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .blog-tag { font-family: var(--mono); font-size: 10px; color: var(--accent); background: rgba(110,231,183,0.06); border: 1px solid rgba(110,231,183,0.15); padding: 0.1rem 0.5rem; border-radius: 3px; }
    .blog-arrow { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 0.8rem; display: inline-block; transition: color 0.2s; }
    .blog-card:hover .blog-arrow { color: var(--accent2); }

    .no-results { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 2rem 0; }

    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 2rem clamp(1.5rem, 5vw, 4rem);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    }
    .footer-copy { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a { font-family: var(--mono); font-size: 11px; color: var(--muted); text-decoration: none; }
    .footer-links a:hover { color: var(--accent); }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">{ vv }</a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#experience">Work</a></li>
    <li><a href="index.html#publications">Papers</a></li>
    <li><a href="blog.html" class="active">Blog</a></li>
    <li><a href="index.html#contact">Contact</a></li>
    <li><a href="ooo.html">OOO</a></li>
  </ul>
</nav>

<main>
  <p class="page-eyebrow">// Writing</p>
  <h1 class="page-title">My tech journal</h1>
  <p class="page-sub">Notes on ML, AI systems, and the things I'm figuring out.</p>
  <div class="divider"></div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-tag="all">All</button>
  </div>

  <div id="blog-list"></div>
</main>

<footer>
  <span class="footer-copy">© 2026 Vidhi Vazirani</span>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="index.html#contact">Contact</a>
  </div>
</footer>

<script src="blogs.js"></script>
<script>
  // Collect all unique tags
  const allTags = [...new Set(BLOGS.flatMap(b => b.tags))].sort();
  const filterBar = document.getElementById('filter-bar');
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    filterBar.appendChild(btn);
  });

  let activeTag = 'all';

  function render() {
    const list = document.getElementById('blog-list');
    const filtered = activeTag === 'all' ? BLOGS : BLOGS.filter(b => b.tags.includes(activeTag));

    if (filtered.length === 0) {
      list.innerHTML = '<p class="no-results">// No posts found for this tag.</p>';
      return;
    }

    list.innerHTML = filtered.map(b => `
      <a class="blog-card" href="${b.url}">
        <div class="blog-meta">${b.date}</div>
        <div class="blog-title">${b.title}</div>
        <div class="blog-excerpt">${b.excerpt}</div>
        <div class="blog-tags">${b.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}</div>
        <span class="blog-arrow">Read →</span>
      </a>`).join('');
  }

  filterBar.addEventListener('click', e => {
    if (!e.target.matches('.filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeTag = e.target.dataset.tag;
    render();
  });

  render();
</script>
</body>
</html>
